name: BedWars1058-MapLoader
main: dev.bwworldloader.WorldLoaderPlugin
version: ${version}
# Ignored by 1.8 - 1.12 servers; on 1.13+ it keeps Bukkit from applying legacy material support.
api-version: '1.13'
description: Just-in-time arena world loading and a configurable map library for BedWars1058.
author: BedWars1058-MapLoader
# NOT "depend": this plugin has to enable BEFORE BedWars1058 so it can silence the harmless
# "There isn't any map called X" warnings BedWars logs for maps that live in the map library.
# It hooks into BedWars1058 as soon as BedWars finishes enabling.
loadbefore: [BedWars1058]

commands:
  bwloader:
    description: Manage BedWars map loading
    usage: /<command> help
    aliases: [bwl, maploader, bedwarsloader]
    permission: bw1058maploader.admin

permissions:
  bw1058maploader.admin:
    description: Use /bwloader (status, reload, config, migrate)
    default: op
